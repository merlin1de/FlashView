name: Feature request
description: An idea for something FlashView should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Write in **English or German**, whichever suits you.

        The most useful requests describe the *situation*, not the solution — what you
        were doing when you wished for it. That often leads somewhere better than the
        feature as first imagined.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The moment in your workflow where FlashView gets in the way.
      placeholder: |
        After a concert I have 2,000 frames from three lenses and want to go through
        the 70-200 shots first. Right now I have to filter by hand every time.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: If you already have a shape in mind, describe it. If not, that's fine too.

  - type: input
    id: workflow
    attributes:
      label: What do you shoot?
      description: Helps to judge how common the situation is.
      placeholder: "Weddings, Canon, ~3,000 frames per job"

  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Another program, a workaround, or simply not at all.
